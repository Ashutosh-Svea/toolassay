[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "toolassay"
version = "0.1.0"
description = "Evaluation harness for MCP tool contracts: does a model pick the right tool, finish the task, and what does it cost."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ashutosh Ranjan" }]
keywords = ["mcp", "model-context-protocol", "evaluation", "llm", "tool-use", "opentelemetry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "anthropic>=1.3,<2",
  "mcp>=2.1,<3",
  "httpx2>=2.5",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML",
]

[project.scripts]
toolassay = "toolassay.cli:app"
toolassay-demo-server = "toolassay.demo.server:main"

[project.urls]
Homepage = "https://github.com/Ashutosh-Svea/toolassay"
Issues = "https://github.com/Ashutosh-Svea/toolassay/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/toolassay"]

[tool.hatch.build.targets.sdist]
include = ["src/toolassay", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PT", "PTH", "N"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011", "PT018"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["opentelemetry.exporter.otlp.proto.http.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:toolassay.*"]
